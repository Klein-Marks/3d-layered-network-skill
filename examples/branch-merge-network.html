<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>双分支并行架构 · 分叉-汇合拓扑演示</title>
<style>
:root{
  --bg:#0a0c12; --bg2:#10131c; --card:#181c28; --border:#252a38; --accent:#e07a35;
  --nlabel:#0a0c12; --ewc:#7a766c; --ebg:rgba(10,12,18,.72);
  --mono:"SF Mono",Consolas,Menlo,monospace;
  --sans:"PingFang SC","Noto Sans SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
  --serif:"Noto Serif SC","Songti SC","SimSun",serif;
}
body.light{
  --bg:#f5efe0; --bg2:#efe7d4; --card:#e9dfc9; --border:#d5c9a9; --accent:#b26a2a;
  --nlabel:#fbf7ec; --ewc:#8a7a5a; --ebg:rgba(250,246,236,.85); color:#3a352c;
}
body.light #left{background:radial-gradient(ellipse 65% 55% at 48% 50%, #fbf6ea 0%, #ede4cf 82%)}
body.light #legend,body.light #hint{background:var(--ebg)}
body.light #cap{background:var(--bg)}
body.light #cap li::before{background:#b26a2a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:#e2e0d8;font-family:var(--sans);font-size:14px}
#app{display:flex;height:100vh}
#left{flex:1;position:relative;overflow:hidden;
  background:radial-gradient(ellipse 65% 55% at 48% 50%, #161b28 0%, #0a0c12 82%)}
#hint{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:10;
  font-size:11px;color:#7a766c;pointer-events:none;
  background:rgba(10,12,18,.6);padding:5px 14px;border-radius:20px;border:1px solid var(--border)}
#hint b{color:var(--accent)}
#scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  user-select:none;-webkit-user-select:none}
#scene *{user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#legend{position:absolute;left:18px;bottom:16px;z-index:10;font-size:11px;
  display:flex;gap:8px;flex-wrap:wrap;max-width:420px;
  background:rgba(10,12,18,.75);padding:8px 12px;border-radius:8px;border:1px solid var(--border)}
#legend .lg{display:inline-flex;align-items:center;gap:4px;color:#7a766c;cursor:pointer}
#legend .lg:hover{color:#e2e0d8}
#legend .lg.off{opacity:.25}
#legend .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
#ctrl{position:absolute;right:16px;top:16px;z-index:10;display:flex;flex-direction:column;gap:6px}
#ctrl button{background:rgba(16,19,28,.8);border:1px solid var(--border);color:#7a766c;
  width:34px;height:34px;border-radius:6px;cursor:pointer;font-size:16px;font-family:var(--sans)}
#ctrl button:hover{color:var(--accent);border-color:var(--accent)}
.eword{position:absolute;transform:translate(-50%,-50%);font-size:10px;color:var(--ewc);
  background:var(--ebg);padding:1px 7px;border-radius:9px;border:1px solid var(--border);
  white-space:nowrap;pointer-events:none;z-index:620;letter-spacing:1px;font-family:var(--sans)}
.eword.hl{color:var(--accent);border-color:var(--accent)}
#right{width:420px;min-width:420px;border-left:1px solid var(--border);
  display:flex;flex-direction:column;background:var(--bg2)}
#panel{flex:1;overflow-y:auto;padding:24px}
#p-title{font-size:18px;font-weight:700;margin-bottom:2px;color:var(--accent);font-family:var(--serif)}
#p-group{font-size:11px;color:#7a766c;margin-bottom:14px;letter-spacing:1px;text-transform:uppercase}
#p-desc{font-size:13px;line-height:1.75;margin-bottom:16px;font-family:var(--serif)}
#p-links .lk-title{color:#7a766c;margin-right:6px;font-size:12px}
#p-links .lk{display:inline-block;background:var(--card);border:1px solid var(--border);
  padding:3px 10px;border-radius:12px;margin:3px 3px 0 0;font-size:11px;cursor:pointer}
#p-links .lk:hover{border-color:var(--accent);color:var(--accent)}
#p-stat{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap}
#p-stat .st{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:8px 12px;flex:1;min-width:70px}
#p-stat .st .v{font-size:18px;font-weight:700;font-family:var(--mono);color:var(--accent)}
#p-stat .st .l{font-size:10px;color:#7a766c}
#cap{height:36%;border-top:1px solid var(--border);overflow-y:auto;padding:18px 24px;background:var(--bg)}
#cap h3{font-size:12px;color:#8a8a5e;margin:0 0 8px;letter-spacing:1px}
#cap ul{list-style:none}
#cap li{font-size:12px;padding:4px 0 4px 16px;position:relative;line-height:1.5;font-family:var(--serif)}
#cap li::before{content:"";position:absolute;left:2px;top:10px;width:5px;height:5px;border-radius:50%;background:#3a6e5a}
@media(max-width:900px){#right{display:none}}
</style>
</head>
<body>
<div id="app">
<div id="left">
<div id="hint">拖拽旋转 · <b>点击主节点</b> 展开/收起该层 · <b>点击节点</b> 详情 · 滚轮缩放 · <b>双击</b> 聚焦 · 共 6 层 · 逻辑词连线</div>
<div id="scene"></div>
<div id="legend"></div>
<div id="ctrl">
<button onclick="toggleTheme()" title="日夜切换">☀</button>
<button onclick="toggleSpin()" title="自动旋转">↻</button>
<button onclick="resetView()" title="重置视角">⊙</button>
</div>
</div>
<div id="right">
<div id="panel">
<h2 id="p-title">双分支并行架构 · 分叉-汇合拓扑</h2>
<div id="p-group">分叉-汇合拓扑 · 主节点骨架 + 点击展开 · 逻辑词仅标数据流</div>
<div id="p-desc">从输入分叉出两条并行处理分支（分支A·规则驱动 + 分支B·模型驱动），在汇合层交叉校验，经整合后输出。点击主节点展开该层模块。</div>
<div id="p-links"></div>
<div id="p-stat"></div>
</div>
<div id="cap">
<h3>拓扑要点</h3>
<ul id="cap-list"></ul>
</div>
</div>
</div>
<script>
const G = {
  L1:{n:"L1 输入",c:"#e8a86e",cl:"#b26a2a",z:0,info:["原始输入数据层","数据源 A + 数据源 B + 待接入源","数据基底，供给两条分支","训练/验证/推理时"]}
  ,L2:{n:"L2 分支A",c:"#7ea8e8",cl:"#3a5f9e",z:2,info:["规则驱动处理分支","规则引擎 + 特征提取 + 校验模块","左分支，从输入直接处理","输入到达时运行"]}
  ,L3:{n:"L3 分支B",c:"#6ec4a8",cl:"#2e7d5b",z:2,info:["模型驱动处理分支","预测模型 + 表征恢复 + 统计模块","右分支，与分支A并行，物理约束驱动的独立视角","输入到达时并行运行"]}
  ,L4:{n:"L4 汇合",c:"#e8789a",cl:"#a64060",z:4,info:["交叉校验层","两分支输出一致性检验 + 差异标记","两管线汇合后的质量门禁","两分支输出后"]}
  ,L5:{n:"L5 整合",c:"#e8e86e",cl:"#8a8a2e",z:6,info:["结果整合与不确定性","融合规则(一致/冲突保留) + 置信度容器","信息整合与量化输出","上游输出后"]}
  ,L6:{n:"L6 输出",c:"#e8a86e",cl:"#b26a2a",z:8,info:["最终呈现","整合结果 + 标注 + 可视化","面向用户的最终输出","整合完成后"]}
};
const N = [
  {id:"srcA",g:"L1",n:"数据源A",d:"基准数据"},
  {id:"srcB",g:"L1",n:"数据源B",d:"扩展数据"},
  {id:"srcC",g:"L1",n:"待接入源",d:"规划中"},
  {id:"rule",g:"L2",n:"规则引擎",d:"确定性规则"},
  {id:"feat",g:"L2",n:"特征提取",d:"手工特征"},
  {id:"check",g:"L2",n:"校验模块",d:"边界校验"},
  {id:"model",g:"L3",n:"预测模型",d:"端到端回归"},
  {id:"recon",g:"L3",n:"表征恢复",d:"中间量重建"},
  {id:"stat",g:"L3",n:"统计模块",d:"统计特征"},
  {id:"xcheck",g:"L4",n:"一致性检验",d:"双分支对齐"},
  {id:"diff",g:"L4",n:"差异标记",d:"分歧区域标记"},
  {id:"fusion",g:"L5",n:"融合规则",d:"一致/冲突保留"},
  {id:"conf",g:"L5",n:"置信度容器",d:"结构化不确定性"},
  {id:"outMain",g:"L6",n:"整合结果",d:"结果+标注"},
  {id:"outViz",g:"L6",n:"可视化",d:"呈现层"}
];
const MAIN_EDGES = [
  {a:"L1",b:"L2",w:"规则处理"},
  {a:"L1",b:"L3",w:"模型处理"},
  {a:"L2",b:"L4",w:"送验"},
  {a:"L3",b:"L4",w:"送验"},
  {a:"L4",b:"L5",w:"校验后整合"},
  {a:"L5",b:"L6",w:"输出"}
];
const E = [
  {a:"feat",b:"fusion",w:"特征"},
  {a:"model",b:"fusion",w:"预测"},
  {a:"stat",b:"fusion",w:"统计"},
  {a:"recon",b:"stat",w:"中间量"},
  {a:"xcheck",b:"diff",w:"标记"},
  {a:"fusion",b:"conf",w:"转置信"}
];
const idx = {}; N.forEach((n,i)=>{n.i=i; idx[n.id]=i;});
const INFO = {
  srcA:["基准数据集","已清洗的结构化输入","分支A/B 训练与验证基础","训练/验证"],
  srcB:["扩展数据集","补充多样性与边界覆盖","泛化验证","训练/验证"],
  srcC:["待接入数据源","规划中的新数据通道","未来数据扩充","接入后"],
  rule:["确定性规则引擎","if-then 规则集 + 优先级","分支A 核心: 规则驱动处理","输入到达时"],
  feat:["手工特征提取器","统计特征 + 结构特征","分支A 特征输出供整合","输入到达时"],
  check:["边界校验器","取值范围 + 一致性检查","分支A 输出质量门禁","特征提取后"],
  model:["端到端预测模型","神经网络回归","分支B 核心: 模型驱动处理","输入到达时"],
  recon:["中间表征恢复器","从输入恢复中间量","分支B 的物理约束环节","输入到达时"],
  stat:["统计特征模块","分布统计 + 偏差度量","分支B 统计输出供整合","表征恢复后"],
  xcheck:["双分支一致性检验","A/B 输出对齐度度量","汇合核心: 一致->高置信/分歧->高不确定","两分支输出后"],
  diff:["差异标记器","分歧区域定位与原因分类","供不确定性容器记录","一致性检验后"],
  fusion:["融合规则引擎","一致/互补/冲突/不可对齐; 不平均不投票保留冲突","信息整合: 保留冲突而非消除","上游输出后"],
  conf:["结构化置信度容器","中心估计 + 区间 + 不确定性 + 原因标签","不确定性量化统一格式","融合后"],
  outMain:["整合结果输出","结果 + 不确定性标注","面向用户的主呈现","整合完成后"],
  outViz:["可视化模块","拓扑 + 结果叠加呈现","交互界面","系统输出时"]
};
const groupNodes = {};
N.forEach(n => { if(!groupNodes[n.g]) groupNodes[n.g] = []; groupNodes[n.g].push(n); });
const LAYER_SPACING = 44;
const BASE_RADIUS = 90;
const RADIUS_STEP = 68;
const MAINS = Object.keys(G);
const MAIN_POS = { L1:{x:0,y:0}, L2:{x:-170,y:0}, L3:{x:170,y:0}, L4:{x:0,y:0}, L5:{x:0,y:0}, L6:{x:0,y:0} };
const P = {};
MAINS.forEach(k => { const mp = MAIN_POS[k]; P[k] = {x:mp.x, y:mp.y, z:G[k].z*LAYER_SPACING}; });
N.forEach(n => {
  const grp = groupNodes[n.g]; const posInGroup = grp.indexOf(n); const count = grp.length;
  const z = G[n.g].z * LAYER_SPACING; const mp = MAIN_POS[n.g] || {x:0,y:0};
  if(count === 1) { P[n.id] = {x:mp.x, y:mp.y, z:z}; return; }
  const r = BASE_RADIUS + (count > 4 ? RADIUS_STEP : count * 8);
  const angle = (posInGroup / count) * Math.PI * 2 - Math.PI / 2;
  P[n.id] = {x:mp.x + Math.cos(angle)*r, y:mp.y + Math.sin(angle)*r, z:z};
});
let rotX = -0.35, rotY = 0.4, zoom = 1, selId = null, autoR = false, dragging = false, lx = 0, ly = 0, dark = true;
const scene = document.getElementById('scene');
const lgd = document.getElementById('legend');
const expanded = new Set();
const isMain = id => MAINS.includes(id);
const isVisible = id => isMain(id) || expanded.has(N[idx[id]].g);
const layerColor = k => dark ? G[k].c : G[k].cl;
MAINS.forEach(k => {
  const el = document.createElement('div'); el.className = 'lg';
  el.innerHTML = `<span class="dot" style="background:${G[k].c}"></span>${G[k].n.replace(/^L\d\s*/,'')}`;
  el.onclick = () => { if(expanded.has(k)){expanded.delete(k);}else{expanded.add(k);} render(); };
  lgd.appendChild(el);
});
function rot3d(p, rx, ry) {
  const cb = Math.cos(ry), sb = Math.sin(ry);
  const x1 = p.x*cb + p.z*sb; const z1 = -p.x*sb + p.z*cb;
  const ca = Math.cos(rx), sa = Math.sin(rx);
  const y1 = p.y*ca - z1*sa; const z2 = p.y*sa + z1*ca;
  return {x:x1, y:y1, z:z2};
}
function nodeRad(n, id) {
  const rid = id || n.id;
  const conns = E.filter(e => e.a===rid || e.b===rid).length + MAIN_EDGES.filter(e => e.a===rid || e.b===rid).length;
  return (16 + Math.min(conns * 2.5, 12)) * zoom;
}
function render() {
  scene.innerHTML = '';
  const cx = scene.clientWidth / 2, cy = scene.clientHeight / 2;
  const PERSP = 800;
  const visRps = [];
  N.forEach(n => { if(isVisible(n.id)) visRps.push(rot3d(P[n.id], rotX, rotY)); });
  MAINS.forEach(k => visRps.push(rot3d(P[k], rotX, rotY)));
  const mx = visRps.reduce((s,p)=>s+p.x,0)/visRps.length;
  const my = visRps.reduce((s,p)=>s+p.y,0)/visRps.length;
  const mz = visRps.reduce((s,p)=>s+p.z,0)/visRps.length;
  const project = (rp) => { const persp = PERSP/(PERSP+(rp.z-mz)); return {sx:(rp.x-mx)*persp*zoom, sy:(rp.y-my)*persp*zoom, depth:rp.z, persp:persp}; };
  const pts = [];
  N.forEach(n => { if(!isVisible(n.id)) return; const pr = project(rot3d(P[n.id], rotX, rotY)); pts.push(pr.sx, pr.sy); });
  MAINS.forEach(k => { const pr = project(rot3d(P[k], rotX, rotY)); pts.push(pr.sx, pr.sy); });
  const shX = (Math.min(...pts.filter((_,i)=>i%2===0)) + Math.max(...pts.filter((_,i)=>i%2===0)))/2;
  const shY = (Math.min(...pts.filter((_,i)=>i%2===1)) + Math.max(...pts.filter((_,i)=>i%2===1)))/2;
  const allEdges = [];
  MAIN_EDGES.forEach(e => allEdges.push({a:e.a,b:e.b,w:e.w}));
  E.forEach(e => allEdges.push({a:e.a,b:e.b,w:e.w}));
  expanded.forEach(k => groupNodes[k].forEach(n => allEdges.push({a:k,b:n.id,w:""})));
  allEdges.forEach(ed => {
    if(!isVisible(ed.a) || !isVisible(ed.b)) return;
    const pa = project(rot3d(P[ed.a], rotX, rotY));
    const pb = project(rot3d(P[ed.b], rotX, rotY));
    const dx = pb.sx-pa.sx, dy = pb.sy-pa.sy;
    const dist = Math.sqrt(dx*dx+dy*dy);
    if(dist < 0.5) return;
    const angle = Math.atan2(dy, dx) * 180 / Math.PI;
    const isHl = (selId === ed.a || selId === ed.b);
    const srcIsMain = isMain(ed.a);
    const color = isHl ? (layerColor(isMain(ed.b)?ed.b:N[idx[ed.b]].g)) : (srcIsMain ? layerColor(ed.a) : layerColor(N[idx[ed.a]].g));
    const el = document.createElement('div');
    el.style.cssText = `position:absolute;left:${cx+pa.sx-shX}px;top:${cy+pa.sy-shY}px;width:${dist}px;height:${isHl?2:1}px;background:${color};opacity:${isHl?0.7:0.15};transform-origin:0 50%;transform:rotate(${angle}deg);pointer-events:none;z-index:${Math.round(Math.min(pa.depth,pb.depth)*0.5)+500}`;
    scene.appendChild(el);
    if(ed.w) {
      const nx = -dy/dist*9, ny = dx/dist*9;
      const lbl = document.createElement('div');
      lbl.className = 'eword' + (isHl ? ' hl' : '');
      lbl.style.cssText += `left:${cx+(pa.sx+pb.sx)/2-shX+nx}px;top:${cy+(pa.sy+pb.sy)/2-shY+ny}px`;
      lbl.textContent = ed.w;
      scene.appendChild(lbl);
    }
  });
  const renderNode = (id, label, isM) => {
    const rp = rot3d(P[id], rotX, rotY);
    const pr = project(rp);
    const base = nodeRad(isM ? null : N[idx[id]], id);
    const rad = (isM ? base*1.7 : base) * pr.persp;
    const el = document.createElement('div');
    const isSel = selId === id;
    const col = isM ? layerColor(id) : layerColor(N[idx[id]].g);
    el.style.cssText = `position:absolute;left:${cx+pr.sx-shX-rad}px;top:${cy+pr.sy-shY-rad}px;width:${rad*2}px;height:${rad*2}px;border-radius:50%;background:${col};border:${isM?'2.5px solid '+(dark?'rgba(255,255,255,.5)':'rgba(255,255,255,.7)'):'1.5px solid rgba(255,255,255,0.15)'};cursor:pointer;z-index:${Math.round(pr.depth)+1000};opacity:${Math.max(0.3,Math.min(1,0.4+pr.persp*0.6))};${isSel?'box-shadow:0 0 24px '+col+'80':isM?'box-shadow:0 0 0 4px '+col+'35':'box-shadow:none'};display:flex;align-items:center;justify-content:center;text-align:center`;
    const fs = Math.max(6, Math.min(10, rad * (isM ? 0.30 : 0.32)));
    const nm = isM ? label.replace(/^L\d\s*/,'') + (expanded.has(id)?' ▾':' ▸') : label;
    el.innerHTML = `<span style="font-size:${fs}px;font-weight:${isM?700:600};color:var(--nlabel);text-shadow:0 1px 3px rgba(0,0,0,.5);pointer-events:none;font-family:var(--sans);white-space:nowrap">${nm}</span>`;
    el.onclick = (e) => { e.stopPropagation(); if(isM) toggleLayer(id); select(id); };
    el.ondblclick = (e) => { e.stopPropagation(); focusNode(id); };
    scene.appendChild(el);
  };
  MAINS.forEach(k => renderNode(k, G[k].n, true));
  N.forEach(n => { if(isVisible(n.id)) renderNode(n.id, n.n, false); });
}
scene.addEventListener('mousedown', e => { dragging = true; lx = e.clientX; ly = e.clientY; autoR = false; });
window.addEventListener('mousemove', e => {
  if(!dragging) return;
  rotY += (e.clientX-lx)*0.006; rotX -= (e.clientY-ly)*0.006;
  rotX = Math.max(-1.3, Math.min(1.3, rotX));
  lx = e.clientX; ly = e.clientY; render();
});
window.addEventListener('mouseup', () => { dragging = false; });
scene.addEventListener('wheel', e => {
  e.preventDefault(); zoom *= e.deltaY > 0 ? 0.92 : 1.08;
  zoom = Math.max(0.4, Math.min(2.5, zoom)); render();
}, {passive: false});
scene.addEventListener('click', e => { if(e.target === scene) { selId = null; render(); updatePanel(null); } });
function toggleLayer(k) { if(expanded.has(k)) expanded.delete(k); else expanded.add(k); render(); }
function toggleTheme() { dark = !dark; document.body.classList.toggle('light', !dark); render(); }
function select(id) { selId = id; render(); updatePanel(id); }
function updatePanel(id) {
  const pt = document.getElementById('p-title'), pg = document.getElementById('p-group'),
        pd = document.getElementById('p-desc'), pl = document.getElementById('p-links'),
        ps = document.getElementById('p-stat');
  if(!id) {
    pt.textContent = '双分支并行架构 · 分叉-汇合拓扑';
    pg.textContent = '分叉-汇合拓扑 · 主节点骨架 + 点击展开 · 逻辑词仅标数据流';
    pd.textContent = '点击主节点展开该层子节点; 点击任意节点查看四段详情。分叉-汇合: 输入 -> 左右分支 -> 汇合校验 -> 整合 -> 输出。';
    pl.innerHTML = ''; ps.innerHTML = ''; return;
  }
  const info = isMain(id) ? G[id].info : (INFO[id] || null);
  pt.textContent = isMain(id) ? G[id].n : N[idx[id]].n;
  pg.textContent = (isMain(id) ? id : N[idx[id]].g) + ' 层 · Z=' + (isMain(id) ? G[id].z : G[N[idx[id]].g].z) + (isMain(id) ? (expanded.has(id) ? ' · 已展开' : ' · 点击展开') : '');
  if(info) {
    const seg = [['功能', info[0]], ['设计逻辑', info[1]], ['架构作用', info[2]], ['触发条件', info[3]]];
    pd.innerHTML = seg.map(([t,c]) => `<div style="margin:7px 0"><b style="color:var(--accent);font-size:12px">${t}</b><br><span style="font-size:13px;line-height:1.7">${c}</span></div>`).join('');
  } else { pd.textContent = N[idx[id]].d; }
  const rel = [];
  allEdgesFor(id).forEach(e => { if(e.a===id) rel.push(e.b); if(e.b===id) rel.push(e.a); });
  pl.innerHTML = '';
  if(rel.length) { const t = document.createElement('span'); t.className='lk-title'; t.textContent='关联:'; pl.appendChild(t); }
  [...new Set(rel)].forEach(rid => {
    const s = document.createElement('span'); s.className = 'lk';
    s.textContent = isMain(rid) ? G[rid].n : N[idx[rid]].n;
    s.style.borderLeft = `3px solid ${layerColor(isMain(rid)?rid:N[idx[rid]].g)}`;
    s.onclick = () => select(rid);
    pl.appendChild(s);
  });
  ps.innerHTML = '';
  const conn = rel.length, grp = isMain(id) ? groupNodes[id].length : N.filter(x => x.g === N[idx[id]].g).length;
  [[conn,'关联'],[grp,'本层节点'],[isMain(id)?G[id].z:G[N[idx[id]].g].z,'Z层']].forEach(([v,l]) => {
    const e = document.createElement('div'); e.className = 'st';
    e.innerHTML = `<div class="v">${v}</div><div class="l">${l}</div>`; ps.appendChild(e);
  });
}
function allEdgesFor(id) {
  const res = [];
  MAIN_EDGES.forEach(e => { if(e.a===id||e.b===id) res.push(e); });
  E.forEach(e => { if(e.a===id||e.b===id) res.push(e); });
  expanded.forEach(k => groupNodes[k].forEach(n => { if(k===id) res.push({a:k,b:n.id,w:''}); if(n.id===id) res.push({a:k,b:n.id,w:''}); }));
  return res;
}
function focusNode(id) {
  const p = P[id];
  rotY = Math.atan2(p.x, p.z); rotX = -Math.atan2(p.y, Math.sqrt(p.x*p.x + p.z*p.z));
  render();
}
function toggleSpin() { autoR = !autoR; if(autoR) spin(); }
function spin() { if(!autoR) return; rotY += 0.004; render(); requestAnimationFrame(spin); }
function resetView() { rotX = -0.35; rotY = 0.4; zoom = 1; render(); }
const CAPS = [
  '分叉-汇合拓扑: 输入 -> 左右分支(L2/L3同z层) -> 汇合(L4) -> 整合 -> 输出',
  'L2/L3 共享 z 值, XY 左右偏移区分分支归属',
  '子节点继承主节点 XY 偏移, 围绕各自分支分布',
  '逻辑词三层分级: 主干数据流加/承载边不加/子节点仅数据流加',
  '冗余路径去除: A->B->C 已有则不建 A->C 直连',
  '投影居中三件套: 动态云中心 + persp 基准 mz + 包围盒平移',
  '双主题切换: 黑夜深底 + 白天米黄'
];
const cl = document.getElementById('cap-list');
CAPS.forEach(c => { const li = document.createElement('li'); li.textContent = c; cl.appendChild(li); });
render();
window.addEventListener('resize', () => render());
</script>
